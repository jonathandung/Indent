name: Build and publish
env:
  TAG: ${{github.ref_name}}
on:
  push: {tags: ["[0-9]+.[0-9]+.[0-9]+"]}
jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment:
      name: gallery
      url: https://www.powershellgallery.com/packages/Indent/${{env.TAG}}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: pwsh
      run: Publish-Module -Path . -NuGetApiKey ${{secrets.PSGALLERY_API_KEY}} -Verbose
    - run: gh release create "$TAG" --title "$TAG" --generate-notes --discussion-category "Releases"
      env:
        GH_TOKEN: ${{github.token}}
    timeout-minutes: 1